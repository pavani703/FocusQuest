<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusQuest</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div id="app"><header><div class="brand">🎯 FocusQuest</div><div><span id="welcome"></span><button class="ghost" onclick="logout()">Logout</button></div></header>
<main><section class="hero"><div><p class="eyebrow">PRODUCTIVITY DASHBOARD</p><h1>Focus better.<br><span>Achieve more.</span></h1><p>Turn focused work into XP, levels and real progress.</p></div><div class="level"><div class="leveltop"><b>Level <span id="level">1</span></b><span id="xp">0 XP</span></div><div class="bar"><i id="xpbar"></i></div></div></section>
<section class="grid"><div class="card timer-card"><div class="tabs"><button class="active" data-mode="FOCUS">Focus</button><button data-mode="SHORT_BREAK">Short Break</button><button data-mode="LONG_BREAK">Long Break</button></div><div class="timer" id="timer">25:00</div><div class="session">Session <span id="sessionNo">1</span> · <span id="modeText">Focus</span></div><div class="actions"><button id="start" class="primary">Start</button><button id="reset" class="secondary">Reset</button></div></div>
<div class="card task-card"><div class="card-title"><h2>My Tasks</h2><span id="taskCount">0</span></div><div class="add"><input id="taskInput" placeholder="What do you want to focus on?"><select id="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select><button onclick="addTask()">Add</button></div><div id="tasks"></div></div></section>
<section class="stats"><div class="stat"><span>🎯</span><b id="statSessions">0</b><small>Focus Sessions</small></div><div class="stat"><span>⏱️</span><b id="statMinutes">0</b><small>Focus Minutes</small></div><div class="stat"><span>⭐</span><b id="statXp">0</b><small>Total XP</small></div><div class="stat"><span>✓</span><b id="statTasks">0</b><small>Completed Tasks</small></div></section></main></div>
<div id="auth" class="auth"><div class="authbox"><h1>🎯 FocusQuest</h1><p>Your productivity journey starts here.</p><div class="auth-tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Register</button></div><div id="form"></div><p id="error"></p></div></div>
<script src="/js/app.js"></script></body></html>
